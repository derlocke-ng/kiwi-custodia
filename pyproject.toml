[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-custodia"
version = "0.6.0"
description = "Distro containers whose every byte leaves through a kiwi-proxy exit — install anything, run it on your desktop, through the tunnel"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["pydantic>=2.6", "kiwi-proxy>=0.6"]

[project.scripts]
kiwi-custodia = "kiwi_custodia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# kiwi_icon.py is the kiwi-icons kit, copied unchanged (github.com/derlocke-ng/kiwi-icons).
extend-exclude = ["src/kiwi_custodia/kiwi_icon.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", ".", "../kiwi-proxy/src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
